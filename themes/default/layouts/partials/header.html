{{slot:beforeHeader}}
<header class="ep-header">
  <div class="ep-container ep-header-inner">
    <a class="ep-brand" href="/">
      <span class="ep-brand-mark" aria-hidden="true">E</span>
      <span>{{site.title}}</span>
    </a>
    <nav class="ep-nav" aria-label="主导航">
      {{{site.navHtml}}}
    </nav>
    <div class="ep-header-actions">
      <button type="button" class="ep-btn ep-btn--ghost" data-open-search aria-label="打开站内搜索">搜索 ⌘K</button>
      <button type="button" class="ep-btn" data-toggle-theme aria-label="切换浅色或暗色主题">明暗</button>
    </div>
  </div>
</header>
