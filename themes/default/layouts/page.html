<!doctype html>
<html lang="{{site.language}}">
<head>
  {{> head}}
</head>
<body>
  {{> header}}
  <main class="ep-main">
    <div class="ep-container">
      <section class="ep-page-header">
        <div>
          <h1>{{page.heading}}</h1>
          <p>{{page.description}}</p>
        </div>
      </section>
      <div class="ep-article-layout">
        <article class="ep-prose">
          {{{page.html}}}
        </article>
        <aside>
          {{slot:sidebar}}
          {{#if page.hasToc}}
          <nav class="ep-toc" aria-label="页面目录">
            <div class="ep-toc-title">本页目录</div>
            <ul>
              {{#each page.toc}}
              <li class="level-{{level}}"><a href="#{{id}}">{{text}}</a></li>
              {{/each}}
            </ul>
          </nav>
          {{/if}}
        </aside>
      </div>
    </div>
  </main>
  {{> footer}}
</body>
</html>
