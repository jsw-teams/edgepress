<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">EdgePress Markdown publishing flow</title>
  <desc id="desc">Markdown source passes through rendering and HTML sanitization to a published post.</desc>
  <rect width="960" height="320" rx="24" fill="#f5f3ee"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#24352d">
    <rect x="44" y="86" width="230" height="148" rx="18" fill="#fff" stroke="#b8c6bc" stroke-width="3"/>
    <text x="159" y="139" font-size="23" font-weight="700">Markdown source</text>
    <text x="159" y="181" font-size="17">content/posts/en.md</text>
    <text x="159" y="209" font-size="17">headings · lists · links</text>
    <path d="M292 160h78m-16-16 16 16-16 16" fill="none" stroke="#426b57" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="382" y="86" width="230" height="148" rx="18" fill="#e3ece5" stroke="#9db4a4" stroke-width="3"/>
    <text x="497" y="139" font-size="23" font-weight="700">EdgePress build</text>
    <text x="497" y="181" font-size="17">CommonMark + GFM</text>
    <text x="497" y="209" font-size="17">safe HTML output</text>
    <path d="M630 160h78m-16-16 16 16-16 16" fill="none" stroke="#426b57" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="720" y="86" width="196" height="148" rx="18" fill="#fff" stroke="#b8c6bc" stroke-width="3"/>
    <text x="818" y="139" font-size="23" font-weight="700">Published post</text>
    <text x="818" y="181" font-size="17">accessible HTML</text>
    <text x="818" y="209" font-size="17">static site output</text>
  </g>
</svg>
