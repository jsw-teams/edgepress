# Site owner settings. Replace the example URL before publishing.
site:
  title: EdgePress
  description: A static website builder for Cloudflare Workers with editable pages, Markdown posts, themes, and plugins.
  url: https://example.com
  language: en
  head:
    titleSuffix: ""
    titleSeparator: " · "
  header:
    showBrand: true
    brandLabel: ""
  components:
    header: true
    primaryNavigation: true
    languageNavigation: true
    footer: true
    footerNavigation: true
  navigation:
    - key: home
      url: "@home"
      labels:
        en: Home
        zh-CN: 首页
    - key: guides
      url: /project-introduction/
      labels:
        en: Guides
        zh-CN: 项目指南
    - key: quick-start
      url: /quick-start/
      labels:
        en: Quick start
        zh-CN: 快速入门
    - key: search
      url: "@search"
      labels:
        en: Search
        zh-CN: 搜索
  footerNavigation:
    - key: privacy
      url: /privacy-policy/
      labels:
        en: Privacy policy
        zh-CN: 隐私政策
    - key: feed
      url: "@feed"
      labels:
        en: Atom feed
        zh-CN: Atom 订阅
  footer: ""
  seo:
    author: EdgePress contributors
    keywords:
      - Markdown website builder
      - Cloudflare Workers
      - static site generator
    image: ""
    robots: index,follow
  # GEO here means agent SEO: make authoritative project information easy to discover and interpret.
  agentSeo:
    enabled: true
    summary: A static website builder for Cloudflare Workers, with row-based editable pages, Markdown posts, themes, plugins, and consent-gated integrations.
    topics:
      - Markdown website builder
      - Cloudflare Workers
      - composable page blocks
      - plugin development
    llmsTxt: true
    agentCrawlers:
      - GPTBot
      - ClaudeBot
      - PerplexityBot
privacy:
  controller:
    name: ""
    contact: ""
  policyUrl: /privacy-policy/
plugins:
  consent:
    enabled: true
    version: "1"
    expiresDays: 180
  tracking:
    enabled: true
    services: []
    # Example:
    # - id: tag-manager
    #   provider: google-tag-manager
    #   purpose: Load consented campaign tags.
    #   retention: Set and disclose the applicable retention period.
    #   containerId: GTM-ABCD123
    # - id: social-pixel
    #   provider: meta-pixel
    #   purpose: Measure consented campaign traffic.
    #   retention: Set and disclose the provider's retention period.
    #   pixelId: "123456789012345"
  statistics:
    enabled: true
    services: []
    # Examples use public provider IDs only.
    # - id: primary-analytics
    #   provider: google-analytics
    #   purpose: Measure consented site visits.
    #   retention: Set and disclose the provider's retention period.
    #   measurementId: G-ABC12345
    # - id: edge-analytics
    #   provider: cloudflare-web-analytics
    #   purpose: Measure consented site visits.
    #   retention: Set and disclose the applicable retention period.
    #   token: 01234567-89ab-cdef-0123-456789abcdef
    # - id: baidu-analytics
    #   provider: baidu-tongji
    #   purpose: Measure consented site visits.
    #   retention: Set and disclose the provider's retention period.
    #   siteId: abcdef0123456789abcdef01
  advertising:
    enabled: true
    services: []
    # Example:
    # - id: display-ads
    #   provider: google-adsense
    #   purpose: Display consented advertising.
    #   retention: Set and disclose the provider's retention period.
    #   clientId: ca-pub-1234567890123456
  captcha:
    enabled: true
    services: []
    # Choose a provider for each CAPTCHA block. Never add its secret key here.
    # - id: contact-form-check
    #   provider: cloudflare-turnstile
    #   purpose: Reduce automated contact form submissions.
    #   retention: Configure and disclose the provider's retention period.
    #   siteKey: 0x4AAAAAAABBBBBBBBCCCCCCDDDD
    # - id: signup-form-check
    #   provider: google-recaptcha
    #   purpose: Reduce automated signup submissions.
    #   retention: Configure and disclose the provider's retention period.
    #   siteKey: 6LcAbCdEfGhIjKlMnOpQrStUvWxYz0123456789a
    # - id: support-form-check
    #   provider: hcaptcha
    #   purpose: Reduce automated support requests.
    #   retention: Configure and disclose the provider's retention period.
    #   siteKey: 0123456789abcdefghijklmnopqrstuvwx
# Add browser services under these groups after filling the real site operator details above.
# Every configured service waits for the visitor's explicit consent before its vendor code loads.
