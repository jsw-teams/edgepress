site:
  timeZone: Asia/Taipei
  title: EdgePress
  description: A static website builder for Cloudflare Workers with editable pages, Markdown posts, themes, and plugins.
  url: https://example.org
  language: en
  dataSaver:
    enabled: false
    debug: false
    mode: auto
    detectSlowConnection: false
    respectBrowserPreference: true
    promptAfterMs: 5000
  head:
    titleSuffix: ""
    titleSeparator: " · "
  header:
    showBrand: true
    brandLabel: ""
  components:
    header: true
    primaryNavigation: true
    languageNavigation: true
    footer: true
    footerNavigation: true
  navigation:
    - key: home
      url: "@home"
      labels:
        en: Home
        zh-CN: 首页
    - key: guides
      url: /project-introduction/
      labels:
        en: Guides
        zh-CN: 项目指南
    - key: quick-start
      url: /quick-start/
      labels:
        en: Quick start
        zh-CN: 快速入门
    - key: posts
      url: "@archives"
      labels:
        en: Posts
        zh-CN: 文章
    - key: search
      url: "@search"
      labels:
        en: Search
        zh-CN: 搜索
  footerNavigation:
    - key: privacy
      url: /privacy-policy/
      labels:
        en: Privacy policy
        zh-CN: 隐私政策
    - key: feed
      url: "@feed"
      labels:
        en: Atom feed
        zh-CN: Atom 订阅
  footer: ""
  author:
    name: toewpq
    avatar: /edgepress/brand/avatar.png
  seo:
    author: toewpq
    keywords:
      - Markdown website builder
      - Cloudflare Workers
      - static site generator
    image: https://example.org/edgepress/brand/og-image.png
    robots: index,follow
  agentSeo:
    enabled: true
    summary: A static website builder for Cloudflare Workers, with row-based editable pages, Markdown posts,
      themes, plugins, and consent-gated integrations.
    topics:
      - Markdown website builder
      - Cloudflare Workers
      - composable page blocks
      - plugin development
    llmsTxt: true
    agentCrawlers:
      - GPTBot
      - ClaudeBot
      - PerplexityBot
privacy:
  controller:
    name: toewpq
    contact: toewpq@gmail.com
  policyUrl: /privacy-policy/
plugins:
  consent:
    enabled: true
    proposedDate: 2026-09-26
    effectiveDate: 2026-09-26
    expiresDays: 180
    services:
      - id: cloudflare-web-analytics
        provider: cloudflare-web-analytics
        name:
          en: Cloudflare Web Analytics
          zh-CN: Cloudflare 网站分析
        purpose:
          en: Measure visits and page performance to improve this site, only after you opt in.
          zh-CN: 在你同意后统计访问与页面性能，用于改进本站。
        dataCategories:
          en: Performance timing and page-view metrics; dimensions can include path, referrer, device, browser,
            operating system, and country. Cloudflare receives the beacon request's source IP and says it
            discards it at the nearest data center without storing it in core databases or logs.
          zh-CN: 性能计时和页面浏览指标，维度可能包括页面路径、来源页、设备、浏览器、操作系统和国家或地区。Cloudflare 会在信标请求中接收来源 IP，并表示会在最近的数据中心将其丢弃，不保存到核心数据库或日志中。
        recipient:
          en: Cloudflare, Inc.
          zh-CN: Cloudflare, Inc.
        retention:
          en: Unsampled beacon data is kept for 7 days, then aggregated to about 10% for long-term storage. Dashboard
            history is available for 6 months.
          zh-CN: 未采样的信标数据保留 7 天，之后会汇总为约 10% 的长期数据。仪表板可查看最近 6 个月的历史记录。
        privacyUrl: https://developers.cloudflare.com/speed/observatory/rum-beacon/
        token: 8347d72ba9f84e6783bf441e7832a80e
      - id: youtube
        provider: oembed
        enabled: true
        name: YouTube
        purpose:
          en: With your permission, load YouTube media and its player on request.
          zh-CN: 在你同意后，按你的请求加载 YouTube 分享内容及播放器。
        dataCategories:
          en: Requested content URL, IP address, browser information; provider cookies may be used after loading.
          zh-CN: 请求的内容链接、IP 地址、浏览器信息；加载后平台可能使用其 Cookie。
        recipient: YouTube
        retention:
          en: The site keeps the consent choice for 180 days; provider retention follows its linked privacy policy.
          zh-CN: 本站保存授权选择 180 天；平台处理与保留规则见所链接的隐私政策。
        privacyUrl: https://policies.google.com/privacy
        backendUrl: https://www.youtube.com
        oembedEndpoint: https://www.youtube.com/oembed
        sourceOrigins:
          - https://www.youtube.com
          - https://youtu.be
          - https://youtube.com
          - https://m.youtube.com
        embedOrigins:
          - https://www.youtube.com
          - https://www.youtube-nocookie.com
      - id: x-posts
        provider: oembed
        enabled: true
        name: X
        purpose:
          en: With your permission, load X media and its player on request.
          zh-CN: 在你同意后，按你的请求加载 X 分享内容及播放器。
        dataCategories:
          en: Requested content URL, IP address, browser information; provider cookies may be used after loading.
          zh-CN: 请求的内容链接、IP 地址、浏览器信息；加载后平台可能使用其 Cookie。
        recipient: X
        retention:
          en: The site keeps the consent choice for 180 days; provider retention follows its linked privacy policy.
          zh-CN: 本站保存授权选择 180 天；平台处理与保留规则见所链接的隐私政策。
        privacyUrl: https://x.com/en/privacy
        backendUrl: https://x.com
        oembedEndpoint: https://publish.x.com/oembed
        sourceOrigins:
          - https://x.com
          - https://twitter.com
          - https://www.x.com
          - https://www.twitter.com
        embedOrigins:
          - https://platform.x.com
          - https://platform.twitter.com
          - https://syndication.twitter.com
          - https://cdn.syndication.twimg.com
          - https://pbs.twimg.com
          - https://abs.twimg.com
          - https://video.twimg.com
        embedScripts:
          - https://platform.x.com/widgets.js
