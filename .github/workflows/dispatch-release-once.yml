name: One-time authorized release dispatcher

on:
  push:
    branches: [main]
    paths: ['.github/workflows/dispatch-release-once.yml']

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.repository == 'jsw-teams/edgepress' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'chore: authorize one-time secure release dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Trigger the existing manually approved release workflow once
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo jsw-teams/edgepress --ref main
