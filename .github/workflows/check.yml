name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: git diff --check && test -s CONTRIBUTING.md && test -s LICENSE && test -s SECURITY.md
      - run: npx playwright install --with-deps chromium firefox
      - run: npm test
      - run: npm run build
      - run: npm run doctor
      - run: npx wrangler deploy --dry-run
