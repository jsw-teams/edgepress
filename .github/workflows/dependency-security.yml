name: Dependency security
on:
  push:
    branches: [main]
    paths: ['package.json', 'package-lock.json', '.github/workflows/dependency-security.yml']
  pull_request:
    paths: ['package.json', 'package-lock.json', '.github/workflows/dependency-security.yml']
  schedule:
    - cron: '17 15 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Audit the committed dependency tree without installing packages
        env:
          npm_config_fetch_timeout: '60000'
          npm_config_fetch_retries: '2'
        run: npm audit --package-lock-only --audit-level=low

  compatibility:
    name: Dependency compatibility (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install exactly the locked dependency tree
        run: npm ci --no-audit --no-fund
      - name: Install browsers for integration tests
        run: npx playwright install --with-deps chromium firefox
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
