name: Dependency security
on:
  push:
    branches: [main]
    paths: ['package.json', 'package-lock.json', '.github/workflows/dependency-security.yml', 'tests/document-package.test.mjs', 'tests/oembed-layout.test.mjs', '.github/workflows/publish.yml', 'tools/release/next-version.mjs', 'tests/release-version.test.mjs', 'src/cli.js', 'src/page-editor.js', 'src/page-editor-client.js', 'src/page-editor.html', 'src/page-editor.css', 'tests/page-editor.test.mjs']
  pull_request:
    paths: ['package.json', 'package-lock.json', '.github/workflows/dependency-security.yml', 'tests/document-package.test.mjs', 'tests/oembed-layout.test.mjs', '.github/workflows/publish.yml', 'tools/release/next-version.mjs', 'tests/release-version.test.mjs', 'src/cli.js', 'src/page-editor.js', 'src/page-editor-client.js', 'src/page-editor.html', 'src/page-editor.css', 'tests/page-editor.test.mjs']
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Audit a freshly resolved disposable dependency tree
        env:
          npm_config_fetch_timeout: '60000'
          npm_config_fetch_retries: '2'
        run: npm run audit

  compatibility:
    name: Dependency compatibility (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install current compatible dependencies
        run: npm install --no-audit --no-fund
      - name: Install browsers for integration tests
        run: npx playwright install --with-deps chromium firefox
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
